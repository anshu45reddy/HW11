name: CLI workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run linting
      run: |
        # Only check for serious errors
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Check everything else but don't fail
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run security checks
      continue-on-error: true  # Don't fail the build for security warnings
      run: |
        bandit -r app/ -c pyproject.toml || true
        safety check || true
    
    - name: Train and validate model
      run: |
        cd app
        # Ensure clean model directory
        rm -rf models
        mkdir -p models/latest
        
        # Set PYTHONPATH and train model
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        python -u train.py
        
        # Verify model files
        echo "Checking model files..."
        ls -la models/latest/
        
        # Verify each required file exists
        for file in model.pkl feature_names.pkl metrics.json metadata.json sample_input.pkl; do
          if [ ! -f "models/latest/$file" ]; then
            echo "Error: $file is missing!"
            exit 1
          fi
          echo "$file exists and has size: $(ls -lh models/latest/$file | awk '{print $5}')"
        done
    
    - name: Run API tests
      run: |
        cd app
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        python -m pytest tests/ -v --cov=. --cov-report=xml
    
    - name: Test API startup
      run: |
        cd app
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        
        # Start the API server in the background with output redirection
        nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
        SERVER_PID=$!
        echo "Started API server with PID $SERVER_PID"
        
        # Function to check if server is ready
        wait_for_server() {
          local max_attempts=30
          local attempt=1
          echo "Waiting for API server to be ready..."
          while [ $attempt -le $max_attempts ]; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "API server is ready!"
              return 0
            fi
            echo "Attempt $attempt/$max_attempts: Server not ready yet..."
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "Server failed to start after $max_attempts attempts"
          cat uvicorn.log
          return 1
        }
        
        # Wait for server to be ready
        if ! wait_for_server; then
          echo "Error: Server failed to start properly"
          kill $SERVER_PID || true
          exit 1
        fi
        
        # Test endpoints
        echo "Testing API endpoints..."
        curl -v http://localhost:8000/ || exit 1
        curl -v http://localhost:8000/model-info || exit 1
        
        # Cleanup
        kill $SERVER_PID || true
    
    - name: Upload coverage report
      if: success()
      uses: codecov/codecov-action@v3
      with:
        file: ./app/coverage.xml
        fail_ci_if_error: false 