name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run linting
      run: |
        # Only check for serious errors
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Check everything else but don't fail
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run security checks
      continue-on-error: true  # Don't fail the build for security warnings
      run: |
        bandit -r app/ -c pyproject.toml || true
        safety check || true
    
    - name: Train and validate model
      run: |
        cd app
        # Ensure clean model directory
        rm -rf models
        mkdir -p models/latest
        
        # Set PYTHONPATH and train model
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        python -u train.py
        
        # Verify model files
        echo "Checking model files..."
        ls -la models/latest/
        
        # Verify each required file exists
        for file in model.pkl feature_names.pkl metrics.json metadata.json sample_input.pkl; do
          if [ ! -f "models/latest/$file" ]; then
            echo "Error: $file is missing!"
            exit 1
          fi
          echo "$file exists and has size: $(ls -lh models/latest/$file | awk '{print $5}')"
        done
    
    - name: Run API tests
      run: |
        cd app
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        python -m pytest tests/ -v --cov=. --cov-report=xml
    
    - name: Test API startup
      run: |
        cd app
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        
        # Start the API server
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        echo "API server started, waiting for it to be ready..."
        
        # Function to check if API is ready
        check_api() {
          curl -s http://localhost:8000/health > /dev/null
          return $?
        }
        
        # Wait for API to be ready
        COUNTER=0
        TIMEOUT=30
        until check_api || [ $COUNTER -eq $TIMEOUT ]; do
          echo "Waiting for API to be ready... ($(( TIMEOUT - COUNTER )) seconds left)"
          sleep 1
          ((COUNTER++))
        done
        
        if [ $COUNTER -eq $TIMEOUT ]; then
          echo "Error: API failed to start within $TIMEOUT seconds"
          exit 1
        fi
        
        echo "API is ready! Testing endpoints..."
        curl -v http://localhost:8000/ || exit 1
        curl -v http://localhost:8000/model-info || exit 1
    
    - name: Upload coverage report
      if: success()
      uses: codecov/codecov-action@v3
      with:
        file: ./app/coverage.xml
        fail_ci_if_error: false 