name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run linting
      run: |
        # Only check for serious errors
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Check everything else but don't fail
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run security checks
      continue-on-error: true  # Don't fail the build for security warnings
      run: |
        bandit -r app/ -c pyproject.toml || true
        safety check || true
    
    - name: Setup model directory
      run: |
        cd app
        mkdir -p models/latest
        ls -la models/
    
    - name: Train model
      run: |
        cd app
        # Add debug output
        echo "Current directory: $(pwd)"
        echo "Python path: $PYTHONPATH"
        # Add app directory to Python path
        PYTHONPATH=$PYTHONPATH:$(pwd)
        python train.py
        # Verify model files were created
        ls -la models/latest/
    
    - name: Test model artifacts
      run: |
        cd app
        # Add app directory to Python path
        PYTHONPATH=$PYTHONPATH:$(pwd)
        python -c "
import joblib
import json
import os
from pathlib import Path

# Check if model directory exists
model_dir = Path('models/latest')
assert model_dir.exists(), 'Model directory not found'
print(f'Contents of {model_dir}:')
print(os.listdir(model_dir))

# Load and validate model artifacts
model = joblib.load(model_dir / 'model.pkl')
feature_names = joblib.load(model_dir / 'feature_names.pkl')
metadata = json.load(open(model_dir / 'metadata.json'))
metrics = json.load(open(model_dir / 'metrics.json'))

# Validate model artifacts
assert len(feature_names) == 4, 'Expected 4 feature names'
assert 'accuracy' in metrics, 'Metrics file missing accuracy'
assert 'version' in metadata, 'Metadata missing version'
assert metrics['accuracy'] > 0.9, 'Model accuracy below threshold'
print('Model artifacts validated successfully!')
        "
    
    - name: Run API tests
      run: |
        cd app
        # Add app directory to Python path
        PYTHONPATH=$PYTHONPATH:$(pwd)
        python -m pytest tests/ -v --cov=. --cov-report=xml
    
    - name: Test API startup
      run: |
        cd app
        # Start the API server with debug output
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        echo "API server started, waiting for it to be ready..."
        
        # Wait for the server to start and test connection
        for i in {1..30}; do
          if curl -s http://localhost:8000/health > /dev/null; then
            echo "API server is ready!"
            break
          fi
          echo "Attempt $i: Waiting for API server..."
          sleep 2
        done
        
        # Run the actual tests
        curl -v --retry 5 --retry-delay 3 --retry-all-errors http://localhost:8000/ || exit 1
        curl -v --retry 5 --retry-delay 3 --retry-all-errors http://localhost:8000/model-info || exit 1
    
    - name: Upload coverage report
      if: success()  # Only upload coverage if tests pass
      uses: codecov/codecov-action@v3
      with:
        file: ./app/coverage.xml
        fail_ci_if_error: false  # Don't fail if coverage upload fails 